name: fix wording
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          sed -i 's/scrim value or direction/scrim edge or colour/' studio/RULES.md
          rm -rf .github
          git config user.name 'CCB publish'
          git config user.email 'noreply@thecodersnook.invalid'
          git add -A
          git commit -m 'Playbook: name the scrim field correctly'
          git push origin HEAD:main

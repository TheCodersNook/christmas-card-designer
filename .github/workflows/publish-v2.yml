name: publish-v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: unpack the finished tree
        run: |
          set -euo pipefail
          curl -fsSL "https://temp.sh/LGMWE/ccb-v2.tar.gz" -o /tmp/v2.tar.gz
          tar xzf /tmp/v2.tar.gz -C .
          mkdir -p assets/models
          touch assets/models/.keep
          rm -f .opencode/skills/christmas-card/scripts/ccstudio/auto.py
          rm -f .opencode/skills/christmas-card/reference/STYLE.md
          git config user.name "ccb studio"
          git config user.email "ccb@users.noreply.github.com"
          git add -A
          git commit -m "v2: rulebook, free compositions, face engine, seeing"
          git push origin HEAD:main
